
<!DOCTYPE html>
<html>
<head>
    <title>CSS Grid Layout</title>
    <style>
        .container {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 5px;
            height: 580px;
            border: 5px solid lime;
            padding: 5px;
        }

        .box {
            padding: 10px;
            border: 1px dotted black;
            font-size: 16px;
        }

        .row1-col1 {
            grid-column: 1 / 3;
            background-color: teal;
        }

        .row1-col2 {
            grid-column: 3 / 7;
            background-color: thistle;
        }

        .row2-col1 {
            grid-column: 2 / 4;
            background-color: tomato;
        }

        .row2-col2 {
            grid-column: 5 / 7;
            background-color: turquoise;
        }

        .row3-col1 {
            grid-column: 2 / 4;
            background-color: violet;
        }

        .row3-col2 {
            grid-column: 4 / 6;
            background-color: yellowgreen;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box row1-col1">Row1 col1</div>
        <div class="box row1-col2">Row1 col2</div>
        <div class="box row2-col1">Row2 col1</div>
        <div class="box row2-col2">Row2 col2</div>
        <div class="box row3-col1">Row3 col1</div>
        <div class="box row3-col2">Row3 col2</div>
    </div>
</body>
</html>
