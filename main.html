
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Layout</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .container {
            width: 600px;
            max-width: 100%;
            border: 5px solid lime;
            background-color: rgb(41, 0, 0);
            padding: 0;
        }

        .row {
            height: 200px;
            border: 5px solid pink;
            margin: 0;
        }

        .col {
            border: 2px dotted rgb(38, 38, 43);
            padding: 8px 12px;
        }

        .row1-col1 {
            background-color: teal;
        }

        .row1-col2 {
            background-color: thistle;
        }

        .row2-col1 {
            background-color: tomato;
        }

        .row2-col2 {
            background-color: turquoise;
        }

        .row3-col1 {
            background-color: violet;
        }

        .row3-col2 {
            background-color: yellowgreen;
        }

        @media (max-width: 767px) {
            .container {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="row">
            <div class="col-4 col-sm-4 col-md-4 row1-col1">Row1 col1</div>
            <div class="col-8 col-sm-8 col-md-8 row1-col2">Row1 col2</div>
        </div>

        <div class="row">
            <div class="col-6 col-md-6 row2-col1">Row2 col1</div>
            <div class="col-6 col-md-6 row2-col2">Row2 col2</div>
        </div>

        <div class="row">
            <div class="col-6 col-md-6 row3-col1">Row3 col1</div>
            <div class="col-6 col-md-6 row3-col2">Row3 col2</div>
        </div>
    </div>

</body>
</html>
